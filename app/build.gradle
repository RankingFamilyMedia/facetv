import java.util.Properties

plugins { id 'com.android.application' }

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('keystore.properties')
if (releasePropertiesFile.isFile()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def releaseStoreFile = System.getenv('FACETV_STORE_FILE') ?: releaseProperties['storeFile']
def releaseStorePassword = System.getenv('FACETV_STORE_PASSWORD') ?: releaseProperties['storePassword']
def releaseKeyAlias = System.getenv('FACETV_KEY_ALIAS') ?: releaseProperties['keyAlias']
def releaseKeyPassword = System.getenv('FACETV_KEY_PASSWORD') ?: releaseProperties['keyPassword']
def releaseKeyConfigured = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def configuredApplicationId = project.findProperty('applicationIdOverride') ?: 'com.mcperry.facetvnews'

android {
 namespace 'com.mcperry.facetvnews'
 compileSdk 36
 defaultConfig { applicationId configuredApplicationId; minSdk 26; targetSdk 36; versionCode 2; versionName '1.0.1' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs {
  release {
   if (releaseKeyConfigured) {
    storeFile rootProject.file(releaseStoreFile)
    storePassword releaseStorePassword
    keyAlias releaseKeyAlias
    keyPassword releaseKeyPassword
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (releaseKeyConfigured) signingConfig signingConfigs.release
  }
 }
}
